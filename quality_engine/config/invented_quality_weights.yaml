# =========================================================================
# Domain Hunter - INVENTED Candidate Quality Weights & Thresholds
# PHASE 1 (REVISED): Multi-Signal Anchoring & Brandability Composite
# =========================================================================
# NOTE: Initial proposed weighting (starting point, tunable via feedback loop / manual review)

invented_quality:
  lexical_proximity: 0.25
  phonetic_proximity: 0.15
  semantic_anchor: 0.20
  brandability_heuristic: 0.25
  pronunciation: 0.10
  distinctiveness: 0.05

anchor_thresholds:
  lexical_anchored_min: 72.0
  phonetic_anchored_min: 78.0
  semantic_anchored_min: 68.0
  hybrid_anchored_requires_n_strong: 2

brandability_subweights:
  length: 0.20
  vowel_ending_bonus_max: 3          # explicitly capped small, per this phase's design decision
  pronunciation_simplicity: 0.18
  orthographic_simplicity: 0.10
  hear_to_spell: 0.12
  syllable_naturalness: 0.10
  unnatural_cluster_penalty: 0.12
  memorability_pattern: 0.08
  distinctiveness: 0.05
  morphological_elegance: 0.05

penalty_tiers:
  strong_multiplier: 1.0
  strong_penalty: 0.0
  moderate_penalty: 6.0
  weak_penalty: 16.0
  extremely_weak_penalty: 26.0
  extremely_weak_brandability_threshold: 40.0
  weak_unanchored_invented_ratio_cap: 0.15

availability_pipeline:
  preferred_available: 45
  max_registry_checks: 600
  batch_initial: 300
  batch_step: 150
  stratified_quotas:
    real_word: 0.20
    compound: 0.20
    semantic: 0.20
    invented_anchored: 0.15
    prefix_suffix: 0.10
    keyword: 0.10
    multilingual_other: 0.05

tier_a_floors:
  min_score: 82.0
  min_pronunciation: 65.0
  min_hear_to_spell: 60.0
  min_commercial_naturalness: 65.0
  min_brandability: 70.0

# =========================================================================
# Quality Engineering Phase: Invented & Strategy Calibration Controls
# =========================================================================
invented_generation:
  baseline_ratio: 0.14
  max_ratio: 0.18
  exploration_ratio: 0.10
  exploration_ratio_max: 0.10
  anchored_ratio_target: 0.90
  min_strategy_quota: 40

strategy_targets:
  ONE_WORD: 350
  COMPOUND: 350
  SEMANTIC: 350
  INVENTED: 270
  PREFIX_SUFFIX: 210
  TREND: 210
  KEYWORD_BRANDABLE: 210

strategy_quotas:
  ONE_WORD: 350
  COMPOUND: 350
  SEMANTIC: 350
  INVENTED: 270
  PREFIX_SUFFIX: 210
  TREND: 210
  KEYWORD_BRANDABLE: 210
  target_total: 1950

invented_brandability:
  anchor_factor_strong: 1.00
  anchor_factor_moderate: 0.88
  anchor_factor_weak: 0.72
  anchor_factor_unanchored: 0.58

commercial_calibration:
  invented_neutral_baseline: 48.0
  short_length_max_bonus: 6.0
  length_bonus_cap: 8.0

trend_calibration:
  invented_unanchored_cap: 40.0
  invented_weak_cap: 55.0

invented_final_gates:
  tier_a_requires: "STRONG"
  tier_b_requires: "MODERATE"
  weak_action: "WATCHLIST"
  unanchored_action: "WATCHLIST"
  extremely_weak_action: "REJECT"

# =========================================================================
# QUALITY CEILINGS (NO HIGH SCORE WITHOUT EVIDENCE)
# =========================================================================
quality_ceilings:
  UNANCHORED:
    max_brandability: 68.0
    max_commercial_score: 55.0
    max_semantic_relevance: 38.0
    max_trend_score: 40.0
    max_overall_quality: 58.0
    max_selection_score: 58.0
    allowed_tiers: ["WATCHLIST"]
  WEAK:
    max_brandability: 74.0
    max_commercial_score: 65.0
    max_semantic_relevance: 50.0
    max_trend_score: 50.0
    max_overall_quality: 66.0
    max_selection_score: 66.0
    allowed_tiers: ["TIER_B", "WATCHLIST"]
  MODERATE:
    max_brandability: 84.0
    max_commercial_score: 80.0
    max_semantic_relevance: 75.0
    max_trend_score: 75.0
    max_overall_quality: 80.0
    max_selection_score: 80.0
    allowed_tiers: ["TIER_B", "WATCHLIST"]
  STRONG:
    max_brandability: 98.0
    max_commercial_score: 98.0
    max_semantic_relevance: 98.0
    max_trend_score: 98.0
    max_overall_quality: 98.0
    max_selection_score: 98.0
    allowed_tiers: ["TIER_A", "TIER_B", "WATCHLIST"]

compound_quality:
  contradictory_modifiers:
    - "low"
    - "down"
    - "less"
    - "off"
    - "sub"
    - "under"
    - "slow"
    - "cold"
    - "dull"
    - "drop"
    - "lost"
    - "late"
    - "zero"
    - "nil"
    - "void"
    - "bad"
    - "pale"
  contradictory_penalty: 36.0
  max_contradictory_naturalness: 45.0
  max_contradictory_commercial: 50.0
  max_contradictory_overall: 60.0
